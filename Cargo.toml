[workspace]
members = [
  "crates/attendance-core",
  "crates/attendance-cli",
  "crates/attendance-napi",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.6"

[workspace.dependencies]
anyhow = "1.0"
calamine = "0.36.1"
napi = { version = "3.12.0", default-features = false, features = ["napi4", "tokio_rt"] }
napi-build = "2.4.0"
napi-derive = "3.2.5"
rust_xlsxwriter = "0.97.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt", "sync"] }
